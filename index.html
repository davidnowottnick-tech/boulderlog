<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boulderlog">
<meta name="theme-color" content="#0d1012">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Boulderlog</title>
<style>
:root{--bg:#0d1012;--card:#161a1e;--card2:#1e2429;--ink:#f1f3f5;--mut:#8b949e;--line:#272d33;--acc:#d4f53c;--accink:#10130a;--ok:#5ee28a;--bad:#ff6b6b;--rest:#4cc9f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#app{max-width:600px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:28px;font-weight:800;margin:4px 0 16px;letter-spacing:-.03em}
h2{font-size:18px;font-weight:700;margin:0 0 8px;letter-spacing:-.01em}
h3{font-size:12px;font-weight:700;margin:16px 0 7px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
p{margin:6px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:0 0 12px}
.mut{color:var(--mut);font-size:14px}
.sm{font-size:13px}
.lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:9px 14px;min-height:42px;font-weight:600}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--accink);font-weight:800}
button.big{width:100%;padding:14px;font-size:16px}
button.ghost{border-color:transparent;background:transparent;color:var(--mut);padding:6px 8px;font-weight:500}
button.on{border-color:var(--acc);color:var(--acc)}
button.okb{min-width:46px;padding:9px 0}
button.okb.on{background:var(--ok);border-color:var(--ok);color:#06200f}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:42px;max-width:100%}
input[type=number]{width:76px}
input[type=checkbox]{min-height:0;width:20px;height:20px;accent-color:var(--acc)}
textarea{width:100%;min-height:64px}
label.f{display:block;margin:12px 0 0;font-size:14px;color:var(--mut)}
label.f>input,label.f>select{display:block;margin-top:4px;color:var(--ink)}
label.c{display:inline-flex;gap:7px;align-items:center;margin:5px 14px 5px 0}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--ink);font-weight:700;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.note{background:var(--card2);border-left:3px solid var(--acc);border-radius:8px;padding:10px 12px;font-size:14px;margin:10px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(13,16,18,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;max-width:120px;border:0;border-radius:0;background:transparent;padding:10px 2px 8px;font-size:10px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:.03em}
nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc)}
.set{display:flex;gap:7px;align-items:center;margin:6px 0;font-size:14px}
.set .n{width:20px;color:var(--mut);font-weight:700}
.blk{border-top:1px solid var(--line);padding:13px 0}
.blk:first-child{border-top:0;padding-top:0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal{background:var(--card);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;padding:8px 4px;min-width:42px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;border-radius:99px;min-height:36px;padding:6px 14px;font-size:13px}
.chips button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.wo{display:flex;gap:12px;align-items:stretch;cursor:pointer}
.wo .st{width:5px;border-radius:5px;flex:none}
.wo b{font-size:16px}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.f{background:var(--ink)}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.bar b{width:44px;text-align:right}
.bar i{display:block;height:16px;border-radius:4px;background:var(--acc);min-width:2px}
.cols{display:flex;align-items:flex-end;gap:4px;height:90px}
.cols div{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.cols div em{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10px;font-style:normal;color:var(--mut)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tiles .card{margin:0}
.tiles strong{font-size:28px;font-weight:800;display:block;letter-spacing:-.02em}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
svg text{fill:var(--mut);font-size:10px}
#timer{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);border-radius:99px;padding:10px 16px;font-weight:800;font-variant-numeric:tabular-nums;z-index:6;border:0}
details summary{cursor:pointer;color:var(--mut);font-size:14px}
ul{margin:6px 0;padding-left:20px}
/* Kalender */
.cyc{display:flex;gap:3px;margin:10px 0 4px}
.cyc i{flex:1;height:7px;border-radius:4px;opacity:.28}
.cyc i.d{opacity:.7}.cyc i.c{opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:11px;font-weight:700;color:var(--mut);padding:4px 0}
.cal button{min-height:54px;padding:5px 0 4px;border-radius:11px;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:14px}
.cal button.o{opacity:.35}
.cal button.t{border-color:var(--ink)}
.cal button.s{background:var(--card2);border-color:var(--acc)}
.cal .dd{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;min-height:7px}
.cal .dd i,.wk .dd i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--c);display:block}
.cal .dd i.f,.wk .dd i.f{background:var(--c)}
.cal .dd i.x,.wk .dd i.x{opacity:.35}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.wk button{padding:7px 0;min-height:56px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut);background:var(--card)}
.wk button b{font-size:15px;color:var(--ink)}
.wk button.t{border-color:var(--acc)}
.wk .dd{display:flex;gap:2px;min-height:7px}
/* Timer-Player */
#player:empty{display:none}
#player{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(28px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));text-align:center}
#player.work{background:var(--acc);color:var(--accink)}
#player.rest{background:#0b2530;color:#dff6ff}
#player.prep{background:#1e2429;color:var(--ink)}
#player .pl{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;opacity:.75}
#player .pt{font-size:22px;font-weight:700;margin-top:6px}
#ptime{font-size:min(34vw,190px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
#player .pn{font-size:15px;opacity:.75;min-height:22px}
#player .pb{display:flex;gap:10px;width:100%;max-width:420px}
#player .pb button{flex:1;background:rgba(0,0,0,.18);border-color:transparent;color:inherit;min-height:54px}
#player.rest .pb button,#player.prep .pb button{background:rgba(255,255,255,.1)}
.pprog{width:100%;max-width:420px;height:5px;border-radius:5px;background:rgba(127,127,127,.3);overflow:hidden}
.pprog i{display:block;height:100%;background:currentColor}
.ab{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.ab .tr{flex:1;height:10px;border-radius:6px;background:var(--card2);position:relative}
.ab .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.ab .tr u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);left:66.6%}
</style>
</head>
<body>
<div id="app"></div>
<div id="navw"></div>
<div id="player"></div>
<script>
'use strict';
/* ---------- Helfer ---------- */
const KEY='boulderlog.v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const num=v=>{if(v===''||v==null)return null;const n=Number(String(v).replace(',','.'));return isNaN(n)?null:n};
const d2s=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const s2d=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>d2s(new Date());
const mondayOf=s=>{const d=s2d(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return d2s(d)};
const addDays=(s,n)=>{const d=s2d(s);d.setDate(d.getDate()+n);return d2s(d)};
const daysBetween=(a,b)=>Math.round((s2d(b)-s2d(a))/864e5);
const wd=s=>(s2d(s).getDay()+6)%7;
const WD=['Mo','Di','Mi','Do','Fr','Sa','So'];
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const fmtDate=s=>{const d=s2d(s);return WD[wd(s)]+', '+d.getDate()+'.'+(d.getMonth()+1)+'.'};
const fmtT=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const sgn=w=>(w>0?'+':w<0?'−':'±')+String(Math.abs(w)).replace('.',',');
const opt=(arr,sel)=>arr.map((x,i)=>`<option value="${i}"${i===sel?' selected':''}>${esc(x)}</option>`).join('');
const r25=v=>Math.round(v/2.5)*2.5;

/* ---------- Grade ---------- */
const FB=['3','4','4+','5','5+','6A','6A+','6B','6B+','6C','6C+','7A','7A+','7B','7B+','7C','7C+','8A','8A+','8B','8B+','8C'];
const FR=['4a','4b','4c','5a','5b','5c','6a','6a+','6b','6b+','6c','6c+','7a','7a+','7b','7b+','7c','7c+','8a','8a+','8b','8b+','8c','8c+','9a'];
const UIAA=[['4',0],['4+',1],['5-',2],['5',3],['5+',4],['6-',4.5],['6',5],['6+',6],['7-',7],['7',8],['7+',9],['8-',10.5],['8',12],['8+',13],['9-',14.5],['9',16],['9+',17],['10-',18],['10',19.5],['10+',21],['11-',22],['11',24]];
const HALL=['1','2','3','4','5','6','7','8'];
const SCALES={hall:{n:'Halle 1–8',g:HALL,kind:'b'},fb:{n:'Fb',g:FB,kind:'b'},uiaa:{n:'UIAA',g:UIAA.map(x=>x[0]),kind:'r'},fr:{n:'Französisch',g:FR,kind:'r'}};
const PLACES={halle:{n:'Halle',scale:'hall'},moon:{n:'Moonboard',scale:'fb'},kilter:{n:'Kilterboard',scale:'fb'},outb:{n:'Outdoor Boulder',scale:'fb'},outr:{n:'Outdoor Route',scale:'uiaa'},home:{n:'Zuhause / Gym',scale:null}};
const STYLES=['Überhang','Senkrecht','Platte','Dach','Leisten','Sloper','Zangen','Dynamisch'];
const norm=c=>c.scale==='hall'?S.hallMap[c.gi]:c.scale==='uiaa'?UIAA[c.gi][1]:c.gi;
const gname=c=>SCALES[c.scale].g[c.gi];
const hg=i=>HALL[clamp(i,0,7)];
const fg=i=>FB[clamp(Math.round(i),0,FB.length-1)];

/* ---------- Übungen ---------- */
const EX={
 hang:{n:'Max-Hangs an der 20-mm-Leiste',m:'hang',sets:5,secs:10,inc:2.5,rest:180,d:'Halb aufgestellte Finger, Schultern aktiv. 10 s hängen, 3 min Pause. Negatives Gewicht = Entlastung (Fuß auf Stuhl oder Gummiband), positives = Zusatzgewicht.'},
 repeaters:{n:'Repeaters 7/3 an der 20-mm-Leiste',m:'hang',sets:5,reps:6,secs:7,rr:3,inc:2.5,rest:180,d:'7 s hängen, 3 s lösen, 6-mal hintereinander = 1 Satz. Deutlich leichter laden als bei Max-Hangs – der letzte Hang soll hart, aber sauber sein.'},
 deadhang:{n:'Hängen an großen Griffen',m:'time',sets:3,lo:20,hi:45,step:5,rest:90,d:'An Henkeln oder der Stange, Schultern leicht nach unten ziehen.'},
 pull:{n:'Klimmzüge',m:'reps',sets:4,lo:3,hi:6,inc:2.5,w:true,rest:150,d:'Sauber, volle Bewegung. Zusatzgewicht per Gurt oder Rucksack.'},
 negpull:{n:'Negative Klimmzüge',m:'reps',sets:3,lo:3,hi:6,rest:120,d:'Oben einsteigen (Sprung/Stuhl) und 5 s kontrolliert ablassen.'},
 row:{n:'Rudern (Ringe / Tischkante)',m:'reps',sets:3,lo:8,hi:12,rest:90,d:'Körper gestreckt, Brust zur Kante ziehen.'},
 push:{n:'Liegestütze',m:'reps',sets:3,lo:8,hi:15,rest:90,d:'Ausgleich für die Zugmuskulatur. Zu leicht? Füße erhöhen.'},
 ohp:{n:'Schulterdrücken (Kurzhanteln)',m:'reps',sets:3,lo:6,hi:10,inc:1,w:true,rest:120,d:'Gewicht pro Hantel.'},
 legraise:{n:'Hängendes Knie-/Beinheben',m:'reps',sets:3,lo:5,hi:12,rest:90,d:'Ohne Schwung. Knie → gestreckte Beine → Zehen zur Stange.'},
 hollow:{n:'Hollow Hold',m:'time',sets:3,lo:20,hi:45,step:5,rest:60,d:'Unterer Rücken bleibt am Boden.'},
 sideplank:{n:'Seitstütz',m:'time',sets:4,lo:20,hi:45,step:5,rest:30,d:'Abwechselnd links und rechts, Hüfte hoch – Körperspannung für Überhänge.'},
 pistol:{n:'Einbeinige Kniebeuge',m:'reps',sets:3,lo:4,hi:8,rest:90,d:'Pro Seite. Bei Bedarf festhalten oder auf eine Box setzen – wichtig für hohe Antreter.'},
 wrist:{n:'Reverse Wrist Curls',m:'reps',sets:2,lo:12,hi:20,inc:1,w:true,rest:60,d:'Unterarmstrecker, leicht und kontrolliert – Vorbeugung für Ellbogen.'},
 ytw:{n:'Y-T-W in Bauchlage',m:'reps',sets:2,lo:8,hi:12,rest:60,d:'Schulterblätter aktiv, Daumen nach oben.'}
};
const MOBH=[['Tiefe Hocke',60],['Froschhaltung',90],['Taube links',60],['Taube rechts',60],['Hamstring-Dehnung links',45],['Hamstring-Dehnung rechts',45],['Schmetterling',60],['Hoher Antreter an der Wand links',40],['Hoher Antreter an der Wand rechts',40]];
const MOBS=[['Katze-Kuh',60],['Brustöffner an der Wand links',45],['Brustöffner an der Wand rechts',45],['Schulterkreisen mit Band oder Stab',60],['Faden durchs Nadelöhr links',45],['Faden durchs Nadelöhr rechts',45],['Unterarmbeuger dehnen',45],['Unterarmstrecker dehnen',45]];
const DRILLS=['Leise Füße: 5 leichte Boulder, jeder Tritt wird lautlos und nur einmal gesetzt','Hover: vor jedem Griff die Hand 2 s über dem Griff schweben lassen (3 Boulder)','Eindrehen: 4 Boulder, jeden Zug eingedreht mit gestrecktem Arm klettern','Wiederholen: einen mittelschweren Boulder 3× klettern, jedes Mal effizienter','Abklettern: 4 leichte Boulder hoch und kontrolliert wieder ab','Tempo: denselben Boulder einmal extrem langsam, einmal zügig-dynamisch'];
const CAT={kl:{n:'Klettern',c:'#d4f53c'},finger:{n:'Finger',c:'#ff8a4c'},kraft:{n:'Kraft',c:'#ff5d73'},pe:{n:'Kraftausdauer',c:'#ffc94d'},aus:{n:'Ausdauer',c:'#4cc9f0'},mob:{n:'Beweglichkeit',c:'#b48cff'}};
const PH=[{k:'g',n:'Grundlage',c:'#4cc9f0',d:'Viel sauberes Klettern, Technik, Ausdauer und allgemeine Kraft – das Fundament für alles Weitere.'},{k:'k',n:'Kraft',c:'#ff5d73',d:'Maximalkraft: Limit-Boulder, Max-Hangs und schwere Klimmzüge.'},{k:'l',n:'Leistung',c:'#d4f53c',d:'Die Kraft in schwere Boulder und Kraftausdauer umsetzen – am Ende steht der Re-Test.'}];
const phase=cw=>PH[Math.floor((cw-1)/4)];
const deloadW=cw=>cw%4===0;
const TESTS=[
 ['weight','Körpergewicht','kg',0],
 ['hangAdd','Fingerkraft: max. Zusatzgewicht für 7 s an der 20-mm-Leiste (negativ = Entlastung)','kg',1],
 ['hangSecs','Alternativ: max. Hängezeit an 20 mm nur mit Körpergewicht','s',1],
 ['pullAdd','Zugkraft: max. Zusatzgewicht für 2 saubere Klimmzüge','kg',1],
 ['pullups','Max. Klimmzüge am Stück','Wdh.',1],['pushups','Max. Liegestütze am Stück','Wdh.',1],
 ['hollow','Core: Hollow Hold, max. Zeit','s',1],['reach','Vorbeuge: Fingerspitzen unter (+) / über (−) Bodenniveau','cm',1],['hip','Frosch an der Wand: Abstand Hüfte–Wand','cm',-1]
];
// Grobe Richtwerte je Boulder-Grad (Fb-Index) – eigene Näherung, keine offiziellen Daten
const BENCH={hang:i=>clamp(105+5.5*(i-5),85,200),pull:i=>clamp(120+3.5*(i-5),100,180),pullups:i=>clamp(Math.round(6+(i-5)),2,22),hollow:i=>clamp(Math.round((30+5*(i-5))/5)*5,20,90)};

/* ---------- Zustand ---------- */
const fresh=()=>({v:2,profile:null,hallMap:[0,1,3,5,8,11,13,16],tests:[],prog:{},cycle:null,cal:[],gen:{},sessions:[],active:null,retestDue:false});
let S;try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=fresh()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Speichern fehlgeschlagen: '+e.message)}};
function migrate(){ // Daten aus Version 1 übernehmen
 if(S.v>=2)return;const map={pe:'pe44',mobility:'mobfull'};
 S.sessions.forEach(s=>{if(!s.wo)s.wo=map[s.type]||s.type||'free'});
 S.cal=S.cal||[];S.gen={};
 if(S.plan){S.cycle={block:S.plan.block||1,week:clamp(S.plan.week||1,1,4),ws:S.plan.weekStart,note:''};
  (S.plan.sessions||[]).filter(p=>p.status==='done').forEach(p=>S.cal.push({id:uid(),date:(S.sessions.find(s=>s.id===p.sid)||{}).date||addDays(S.plan.weekStart,p.day),wo:map[p.type]||p.type,status:'done',auto:true,sid:p.sid}))}
 delete S.plan;S.active=null;
 if(S.prog&&S.prog.hang&&!S.prog.repeaters)S.prog.repeaters={w:S.prog.hang.w-15};
 S.v=2;save();
}
migrate();
const U={tab:'heute',modal:null,cf:null,pyr:'hall',exStat:'pull',timerEnd:0,cat:'all',day:null,month:null,st:'stat'};

/* ---------- Profil, Level, Tests ---------- */
const bIdx=()=>Math.max(S.hallMap[S.profile.maxHall]??0,S.profile.maxFb??0);
function level(){const b=bIdx();let L=b>=11?2:b>=5?1:0;if(S.profile.years<1)L=0;return L}
const lastTest=()=>S.tests.length?S.tests[S.tests.length-1].v:{};
const hasBar=()=>S.profile.equip.bar||S.profile.equip.hangboard;
const cl=()=>{const c=S.prog.climb||(S.prog.climb={});c.vol=c.vol||8;c.pe=c.pe||3;c.arc=c.arc||8;c.emom=c.emom||8;c.drill=c.drill||0;return c};
function initP(id){const d=EX[id];return d.m==='hang'?{w:0}:d.m==='time'?{t:d.lo}:{r:d.lo,w:0}}
function calibrate(){
 const t=lastTest(),p=S.profile,bw=t.weight||p.weight||70,L=level(),P={};
 for(const id in EX)P[id]=initP(id);
 const mp=t.pullups??5;P.usePull=mp>=3;
 if(t.pullAdd!=null&&mp>=3)P.pull={w:Math.max(0,r25((bw+t.pullAdd)*.87-bw)),r:3};

function fillWeeks(){const c=S.cycle,days=[...S.profile.days].sort((a,b)=>a-b),t0=today(),sg=sig();let ch=false;
 for(let i=0;i<5;i++){const ws=addDays(c.ws,7*i),we=addDays(ws,7);let cw=c.week+i,bl=c.block;while(cw>12){cw-=12;bl++}
  const key=bl+'/'+cw+sg;if(S.gen[ws]===key)continue;ch=true;
  S.cal=S.cal.filter(e=>!(e.auto&&e.status==='open'&&e.date>=ws&&e.date<we));
  const have=S.cal.filter(e=>e.auto&&e.date>=ws&&e.date<we).map(e=>e.wo);
  template(cw).forEach((wo,j)=>{const k=have.indexOf(wo);if(k>=0){have.splice(k,1);return}const date=addDays(ws,days[j]);if(date>=t0)S.cal.push({id:uid(),date,wo,status:'open',auto:true})});
  S.gen[ws]=key}
 for(const k in S.gen)if(k<c.ws){delete S.gen[k];ch=true}

function ensurePlan(){
 if(!S.profile)return;const ws=mondayOf(today());
 if(!S.cycle){S.cycle={block:1,week:1,ws,note:'Dein Zyklus: 12 Wochen in drei Phasen – Grundlage, Kraft, Leistung. Jede vierte Woche ist Entlastung.'};fillWeeks();save();return}
 if(S.cycle.ws!==ws){
  const c=S.cycle,gap=daysBetween(c.ws,ws)/7,pw=S.cal.filter(e=>e.auto&&e.date>=c.ws&&e.date<addDays(c.ws,7));
  const done=pw.filter(e=>e.status==='done').length,tot=pw.length;
  const last=S.sessions.length?S.sessions.map(s=>s.date).sort().pop():null;
  const wk=S.sessions.filter(s=>s.date>=c.ws&&s.date<addDays(c.ws,7));
  const avg=(a,k)=>a.length?a.reduce((x,s)=>x+(k(s)||0),0)/a.length:0;
  S.cal.forEach(e=>{if(e.status==='open'&&e.date<ws)e.status='missed'});
  let week=c.week,block=c.block,note='';
  if(gap>=3||(last&&daysBetween(last,today())>14)){
   week=Math.floor((week-1)/4)*4+1;
   for(const id in EX){const d=EX[id],p=S.prog[id];if(!p)continue;if(d.m==='hang')p.w-=5;else if(d.w&&p.w>0)p.w=Math.max(0,p.w-d.inc*2);else if(d.m==='time')p.t=Math.max(d.lo,p.t-d.step);else p.r=Math.max(d.lo,p.r-1)}
   cl().vol=Math.max(6,cl().vol-2);
   note='Wiedereinstieg nach längerer Pause: Die Phase beginnt von vorn, Lasten und Umfang wurden etwas reduziert.';
  }else if(tot===0){note=''}
  else if(done/tot<.5){note=`Letzte Woche ${done} von ${tot} geplanten Einheiten geschafft – die Woche wird wiederholt.`}
  else{
   week++;
   if(week>12){week=1;block++;S.retestDue=true;note='Neuer Zyklus! Trag jetzt deinen Re-Test ein, damit Lasten und Fokus neu berechnet werden.'}
   else if(!deloadW(week)&&wk.length>=2&&avg(wk,s=>s.rpe)>=8.5&&avg(wk,s=>s.ready&&s.ready.energy)<=2.5){week=Math.ceil(week/4)*4;note='Hohe Belastung bei niedriger Energie letzte Woche – die Entlastungswoche wird vorgezogen.'}
   else if(week===12){S.retestDue=true;note='Entlastungs- und Testwoche: weniger Umfang, und ausgeruht den Re-Test machen (Fortschritt → Tests).'}
   else if(deloadW(week))note='Entlastungswoche: ca. 40 % weniger Umfang bei gleicher Intensität. So wird die Arbeit der letzten Wochen zu Leistung.';
   else if(week%4===1)note=`Neue Phase: ${phase(week).n}. ${phase(week).d}`;
  }
  S.cycle={block,week,ws,note};S.gen={};
 }
 if(fillWeeks())save();
}

function adapt(wo,r){
 const dl=isDeload();let f=dl?.6:1,noProg=dl,msgs=[],lim=false,keepOpen=false;const hard=WO[wo].int>=4;
 if(dl)msgs.push('Entlastungswoche: reduzierter Umfang.');
 const score=(r.energy+r.sleep+(6-r.sore))/3;
 if(r.finger===2){wo='mobfull';f=1;noProg=true;keepOpen=true;msgs.push('Fingerschmerz: heute kein Hangboard und kein Klettern am Limit, stattdessen Mobility. Wenn der Schmerz anhält, lass ihn abklären.')}
 else{
  if(score<2.4){if(hard){wo='technik';keepOpen=true}f=Math.min(f,.6);noProg=true;msgs.push('Niedrige Tagesform: lockere Einheit mit reduziertem Umfang statt hartem Training.'+(keepOpen?' Die geplante Einheit bleibt im Kalender offen.':''))}
  else if(score<3.3){f*=.8;noProg=true;msgs.push('Mittlere Tagesform: Umfang um ca. 20 % reduziert, heute keine Steigerung.')}
  else if(score>=4.4&&!dl)msgs.push('Starker Tag: Wenn es sich leicht anfühlt, markiere die Übungen als „leicht“ – dann steigert der Plan schneller.');
  if(r.finger===1){lim=true;if(['limit','combo','limitK','board','maxhang','repeaters'].includes(wo)){wo='volume';keepOpen=true}msgs.push('Gereizte Finger/Haut: kein Hangboard und keine kleinen Leisten am Limit.')}
 }
 if(r.short){f*=.75;msgs.push('Wenig Zeit: Umfang gekürzt.')}
 return{wo,f,noProg,msgs,lim,keepOpen};
}

/* ---------- Progression ---------- */
function progress(id,success,feel,out){
 const d=EX[id],p=S.prog[id],before=fmtP(id,p);
 const adv=()=>{if(d.m==='hang')p.w+=d.inc;else if(d.m==='time'){if(p.t<d.hi)p.t+=d.step}else if(p.r<d.hi)p.r++;else if(d.w){p.w+=d.inc;p.r=d.lo}else if(id==='negpull'){S.prog.usePull=true;S.prog.pull={w:0,r:3};out.push('Negative Klimmzüge gemeistert – ab jetzt echte Klimmzüge!')}};
 const reg=()=>{if(d.m==='hang')p.w-=d.inc;else if(d.m==='time')p.t=Math.max(d.lo,p.t-d.step);else if(p.r>d.lo)p.r--;else if(d.w&&p.w>0)p.w=Math.max(0,p.w-d.inc)};
 if(!success){p.streak=0;p.fails=(p.fails||0)+1;if(p.fails>=2){p.fails=0;reg()}}
 else{p.fails=0;if(feel==='hart')p.streak=0;else{p.streak=(p.streak||0)+1;if(feel==='leicht'||p.streak>=2){p.streak=0;adv()}}}
 const after=fmtP(id,p);if(after!==before)out.push(`${d.n}: ${before} → ${after}`);
}
function finishSession(rpe,dur,date,notes){
 const a=S.active,out=[],c=cl();
 for(const b of a.blocks){
  if(b.k==='ex'){const t=b.target,d=EX[b.id];
   const good=b.sets.filter(s=>s.ok&&(d.m==='reps'?(s.reps??0)>=t.r&&(s.w??0)>=(t.w||0):d.m==='hang'?(s.secs??0)>=d.secs&&(s.w??0)>=t.w:(s.secs??0)>=t.t)).length;
   if(b.sets.some(s=>s.ok)&&!a.noProg)progress(b.id,good>=b.sets.length,b.feel,out);
  }
  if(b.k==='climb'&&!a.noProg&&b.feel!=='hart'){const tops=a.climbs.filter(x=>x.top).length;
   if(b.mode==='volume'&&tops>=b.target&&c.vol<16){c.vol++;out.push(`Volumen: nächstes Mal ${c.vol} Boulder`)}
   if(b.mode==='pe'&&(b.rounds||0)>=b.target&&c.pe<6){c.pe++;out.push(`4×4: nächstes Mal ${c.pe} Runden`)}
   if(b.mode==='arc'&&b.done&&c.arc<15){c.arc++;out.push(`Dauerklettern: nächstes Mal ${c.arc} min pro Durchgang`)}
   if(b.mode==='emom'&&b.done&&c.emom<12){c.emom++;out.push(`Minutentakt: nächstes Mal ${c.emom} min pro Runde`)}
  }
  if(b.k==='check'&&b.title==='Technik-Drill'&&b.items[0].ok)c.drill++;
 }
 const p=S.profile;
 for(const x of a.climbs)if(x.top){
  if(x.scale==='hall'&&x.gi>p.maxHall){p.maxHall=x.gi;out.push(`Neuer Hallen-Bestwert: Grad ${HALL[x.gi]} – die Zielgrade im Plan steigen mit.`)}
  if(x.scale==='fb'&&x.gi>(p.maxFb??-1)){if(p.maxFb!=null)out.push(`Neuer Fb-Bestwert: ${FB[x.gi]}`);p.maxFb=x.gi}
 }
 S.sessions.push({id:a.id,date,wo:a.wo,place:a.place,ready:a.ready,rpe,dur,notes,climbs:a.climbs,blocks:a.blocks.filter(b=>b.k==='ex'||b.k==='climb'),calId:a.calId});
 S.sessions.sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0);
 if(a.calId){const en=S.cal.find(e=>e.id===a.calId);if(en){en.status='done';en.sid=a.id;en.date=date}}
 S.active=null;U.timerEnd=0;save();
 U.modal={k:'summary',out};render();window.scrollTo(0,0);
}

let P=null,AC=null;
function beep(f,d){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.3,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function stepsFor(bi){const b=S.active.blocks[bi],st=[];
 const W=(label,secs,mark)=>st.push({t:'work',label,secs,mark}),R=(label,secs)=>{if(secs>0)st.push({t:'rest',label,secs})};
 if(b.k==='ex'){const d=EX[b.id];if(d.m==='reps')return null;const n=b.sets.length,reps=d.m==='hang'?(d.reps||1):1;
  b.sets.forEach((s,si)=>{if(s.ok)return;const secs=s.secs||d.secs||20;
   for(let r=0;r<reps;r++){W(`Satz ${si+1} von ${n}`+(reps>1?` · Hang ${r+1}/${reps}`:''),secs,r===reps-1?['set',si]:null);if(r<reps-1)R('Lösen',d.rr)}
   R('Satzpause',d.rest)})}
 else if(b.k==='routine')b.items.forEach((it,ii)=>{if(it.ok)return;W(it.t,it.secs,['item',ii]);R('Wechsel',6)});
 else if(b.k==='climb'&&(b.mode==='arc'||b.mode==='emom')){
  for(let s=0;s<b.sets;s++){if(b.mode==='arc')W(`Durchgang ${s+1} von ${b.sets} · locker klettern`,b.target*60);else for(let m=0;m<b.target;m++)W(`Runde ${s+1} von ${b.sets} · Boulder ${m+1}/${b.target}`,60);R('Pause',300)}}
 else return null;
 while(st.length&&st[st.length-1].t==='rest')st.pop();
 if(!st.length)return null;
 if(b.k==='climb')st[st.length-1].mark=['done'];
 st.unshift({t:'prep',label:'Mach dich bereit',secs:10});return st;
}
function drawPlayer(){const el=document.getElementById('player');if(!P){el.innerHTML='';el.className='';return}
 const s=P.steps[P.i],nx=P.steps[P.i+1],left=P.paused?Math.ceil(P.left/1000):Math.max(0,Math.ceil((P.end-Date.now())/1000));
 el.className=s.t;
 el.innerHTML=`<div style="width:100%;display:flex;flex-direction:column;align-items:center;gap:12px"><div class="pprog"><i style="width:${Math.round(P.i/P.steps.length*100)}%"></i></div><div><div class="pl">${s.t==='work'?'Belastung':s.t==='rest'?'Pause':'Start'}</div><div class="pt">${esc(s.label)}</div></div></div>
 <div id="ptime">${fmtT(left)}</div>
 <div style="width:100%;display:flex;flex-direction:column;align-items:center;gap:14px"><div class="pn">${nx?'Danach: '+esc(nx.label)+' · '+fmtT(nx.secs):'Letzter Schritt'}</div>
 <div class="pb"><button data-a="pstop">Beenden</button><button data-a="ppause">${P.paused?'Weiter':'Pause'}</button><button data-a="pskip">Überspringen</button></div></div>`;
}
function startPlayer(bi){const steps=stepsFor(bi);if(!steps)return;P={bi,steps,i:0,end:Date.now()+steps[0].secs*1000,paused:false,left:0,last:null};
 try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>{if(P)P.lock=l;else l.release()}).catch(()=>{})}catch(e){}
 beep(660,.15);drawPlayer()}
function stopPlayer(){if(P&&P.lock)P.lock.release().catch(()=>{});P=null;drawPlayer();save();render()}
function advance(mark){const s=P.steps[P.i];
 if(mark&&s.mark){const b=S.active.blocks[P.bi];if(s.mark[0]==='set')b.sets[s.mark[1]].ok=true;else if(s.mark[0]==='item')b.items[s.mark[1]].ok=true;else b.done=true;save()}
 P.i++;if(P.i>=P.steps.length){beep(990,.6);if(navigator.vibrate)navigator.vibrate([200,100,200]);stopPlayer();return}
 P.end=Date.now()+P.steps[P.i].secs*1000;P.left=P.steps[P.i].secs*1000;P.last=null;beep(P.steps[P.i].t==='work'?880:440,.3);if(navigator.vibrate)navigator.vibrate(150);drawPlayer()}
setInterval(()=>{if(!P||P.paused)return;const left=Math.ceil((P.end-Date.now())/1000);if(left<=0){advance(true);return}
 if(left!==P.last){P.last=left;if(left<=3)beep(520,.09);const el=document.getElementById('ptime');if(el)el.textContent=fmtT(left)}},100);

function lineChart(pts,fmt){

 pstop(){stopPlayer();return false},
 setok(d){const s=S.active.blocks[d.b].sets[d.s];s.ok=!s.ok;if(s.ok&&+d.rest)U.timerEnd=Date.now()+d.rest*1000},
 addset(d){const b=S.active.blocks[d.b];b.sets.push({...b.sets[b.sets.length-1],ok:false})},
 rmblock(d){S.active.blocks.splice(d.b,1)},
 addex(){S.active.blocks.push(exBlock(document.getElementById('addex').value,1))},
 feel(d){const b=S.active.blocks[d.b];b.feel=b.feel===d.v?null:d.v},
 rounds(d){const b=S.active.blocks[d.b];b.rounds=Math.max(0,(b.rounds||0)+ +d.d);if(+d.d>0&&b.rounds<b.target)U.timerEnd=Date.now()+240000},
 tries(d){U.cf.tries=Math.max(1,U.cf.tries+ +d.d)},
 toptoggle(){U.cf.top=!U.cf.top},
 addclimb(){const c=U.cf;S.active.climbs.push({scale:c.scale,gi:c.gi,tries:c.tries,top:c.top,style:c.style});c.tries=1;c.top=true},
 rmclimb(d){S.active.climbs.splice(d.i,1)},
 finish(){U.modal={k:'finish',rpe:6}},
 rpe(d){U.modal.rpe=+d.v},
 stoptimer(){U.timerEnd=0},
 pyr(d){U.pyr=d.v},
 newTest(){U.modal={k:'test'}},
 skipRetest(){S.retestDue=false},
 delsession(d){if(confirm('Diese Session wirklich löschen?')){S.sessions=S.sessions.filter(s=>s.id!==d.id);S.cal.forEach(e=>{if(e.sid===d.id){e.status=e.date<today()?'missed':'open';delete e.sid}})}},
 export(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='boulderlog-'+today()+'.json';a.click();return false},
 import(){document.getElementById('imp').click();return false},
 reset(){if(confirm('Wirklich ALLE Daten löschen? Das kann nicht rückgängig gemacht werden.')&&confirm('Sicher? Vorher exportiert?')){S=fresh();U.tab='heute'}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const fn=A[el.dataset.a];if(!fn)return;if(el.type!=='submit')e.preventDefault();if(fn(el.dataset)===false)return;save();render()});
const C={
 set(el){const s=S.active.blocks[el.dataset.b].sets[el.dataset.s];s[el.dataset.k]=num(el.value)},
 cfscale(el){U.cf.scale=el.value;U.cf.gi=null;return true},
 cfgi(el){U.cf.gi=+el.value},
 cfstyle(el){U.cf.style=el.value},
 rshort(el){U.modal.r.short=el.checked},
 emove(el){if(!el.value)return;const e=ent(el.dataset.id);e.date=el.value;U.day=el.value;U.month=el.value.slice(0,7);return true},
 ewo(el){ent(el.dataset.id).wo=el.value;return true},
 prog(el){const v=num(el.value);if(v!=null)S.prog[el.dataset.id][el.dataset.k]=v},
 progc(el){const v=num(el.value);if(v!=null)cl()[el.dataset.k]=Math.max(1,Math.round(v))},
 hallmap(el){S.hallMap[el.dataset.i]=+el.value},
 exstat(el){U.exStat=el.value;return true}
};
document.addEventListener('change',e=>{const el=e.target;
 if(el.id==='imp'&&el.files[0]){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d||!Array.isArray(d.sessions))throw new Error('Keine Boulderlog-Datei');if(confirm('Aktuelle Daten durch den Import ersetzen?')){S=Object.assign(fresh(),d);migrate();save();render()}}catch(err){alert('Import fehlgeschlagen: '+err.message)}};fr.readAsText(el.files[0]);return}
 const fn=C[el.dataset.c];if(!fn)return;const re=fn(el);save();if(re)render()});
document.addEventListener('submit',e=>{const f=e.target.dataset.f;if(!f)return;e.preventDefault();const fd=new FormData(e.target);
 if(f==='profile'){const days=fd.getAll('day').map(Number);if(!days.length){alert('Bitte mindestens einen Trainingstag wählen.');return}
  const first=!S.profile;
  S.profile={weight:num(fd.get('weight')),years:+fd.get('years'),maxHall:+fd.get('maxHall'),maxFb:fd.get('maxFb')===''?null:+fd.get('maxFb'),days,equip:Object.fromEntries(['hangboard','bar','weights','moon','kilter'].map(k=>[k,fd.get('eq_'+k)==='on']))};
  if(first){calibrate();save();render();U.modal={k:'test'};render();window.scrollTo(0,0);return}
  save();render();alert('Profil gespeichert.');}
 if(f==='test'){const v={};TESTS.forEach(([k])=>{const n=num(fd.get(k));if(n!=null)v[k]=n});
  if(!Object.keys(v).length){alert('Bitte mindestens einen Wert eintragen.');return}
  if(v.weight)S.profile.weight=v.weight;
  const recal=!S.tests.length||!S.sessions.length||confirm('Trainingslasten anhand der neuen Testwerte neu berechnen? (Abbrechen = aktuelle Lasten behalten)');
  S.tests.push({date:today(),v:{...lastTest(),...v}});if(recal)calibrate();S.retestDue=false;U.modal=null;U.tab='stats';U.st='tests';save();render();window.scrollTo(0,0)}
 if(f==='finish'){finishSession(U.modal.rpe,num(fd.get('dur')),fd.get('date')||today(),fd.get('notes')||'')}
});
render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
</body>
</html>
